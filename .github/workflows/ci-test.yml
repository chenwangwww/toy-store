name: Next.js CI Test

on:
  # 允许在 GitHub 网页端手动点击按钮触发测试
  workflow_dispatch:
  # 推送代码到 master 分支时自动触发
  push:
    branches: [master]

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client 是「生成产物」，不提交到仓库。
      # pnpm-workspace.yaml 里 allowBuilds 关掉了 @prisma/client 的 postinstall，
      # 所以这里必须显式生成，否则 next build 的类型检查会报
      # "Module '@prisma/client' has no exported member 'PrismaClient'" 等一连串错误。
      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Lint
        run: pnpm lint

      - name: Build Next.js
        run: pnpm build